<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="460" viewBox="0 0 1020 460" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
  <rect width="1020" height="460" fill="white"/>

  <!-- Offer delivery -->
  <rect x="150" y="30" width="190" height="130" fill="rgb(204,255,255)"/>
  <text x="245" y="104" text-anchor="middle">Receive</text>
  <text x="245" y="128" text-anchor="middle">Through</text>
  <text x="245" y="146" text-anchor="middle">QR, PUSH, etc.</text>
  <path d="M 360 380 L 130 380 L 130 257" fill="none" stroke="black" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <path d="M 130 205 L 130 80 L 358 80" fill="none" stroke="black" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="245" y="400" text-anchor="middle">Generate</text>
  <path d="M 36 205 L 250 205 L 230 255 L 16 255 Z" fill="rgb(232,238,247)" stroke="black"/>
  <text x="133" y="226" text-anchor="middle">VerifyOffer /</text>
  <text x="133" y="243" text-anchor="middle">Authorization Request URI</text>

  <!-- Services -->
  <g fill="rgb(67,141,213)" stroke="rgb(60,127,192)">
    <rect x="360" y="20" width="220" height="120"/>
    <rect x="360" y="320" width="220" height="120"/>
    <rect x="640" y="20" width="220" height="120"/>
    <rect x="780" y="320" width="220" height="120"/>
  </g>
  <g fill="white" text-anchor="middle">
    <text x="470" y="50">&lt;&lt;Mobile App&gt;&gt;</text>
    <text x="470" y="76" font-size="16" font-weight="bold">CApp</text>
    <text x="470" y="122">Certified App for holder</text>
    <text x="470" y="350">&lt;&lt;API Service&gt;&gt;</text>
    <text x="470" y="376" font-size="16" font-weight="bold">Verifier Service</text>
    <text x="750" y="50">&lt;&lt;API Service&gt;&gt;</text>
    <text x="750" y="76" font-size="16" font-weight="bold">Issuer Service</text>
    <text x="890" y="350">&lt;&lt;Blockchain / LSS&gt;&gt;</text>
    <text x="890" y="376" font-size="16" font-weight="bold">Trust Repository</text>
  </g>

  <!-- Holder to Verifier -->
  <path d="M 470 140 L 470 318" fill="none" stroke="black" marker-end="url(#arrow)"/>
  <g font-weight="bold">
    <text x="478" y="205">P310 - Present VP</text>
    <text x="478" y="228">P311 - Present ZKP Proof</text>
    <text x="478" y="251">OID4VP - Request / Response</text>
  </g>

  <!-- Verifier to external services -->
  <path d="M 580 350 L 720 350 L 720 142" fill="none" stroke="black" marker-end="url(#arrow)"/>
  <text x="728" y="250" font-weight="bold">Get Status List Token</text>
  <path d="M 580 400 L 778 400" fill="none" stroke="black" marker-end="url(#arrow)"/>
  <text x="680" y="392" text-anchor="middle" font-weight="bold">Get DID Doc</text>
  <text x="680" y="418" text-anchor="middle" font-weight="bold">Get VC Meta</text>
</svg>
